name: Owner-approved PAPER Code Update

'on':
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owner-approved-code-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == '18badr19-sudo' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'code-agent/numeric-repair-') &&
      github.event.pull_request.base.ref == 'main' &&
      vars.JALWE_CODE_AGENT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recheck exact owner-reviewed head and unchanged numeric policy
        env:
          CODE_UPDATE_GITHUB_TOKEN: ${{ github.token }}
        run: python -m self_update.cli review-prepare
      - name: Retest approved candidate with unchanged PAPER tests
        env:
          ALPACA_API_KEY: test-key
          ALPACA_SECRET_KEY: test-secret
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          PAPER_TRADING: 'true'
          ALLOW_LIVE_TRADING: 'false'
          TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/bridge_test
        run: python -m unittest discover -s tests -v > .agent-work/tests.log 2>&1
      - name: Attest exact approved bytes and successful full suite
        env:
          PAPER_TRADING: 'true'
          ALLOW_LIVE_TRADING: 'false'
        run: python -m self_update.cli attest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-work/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: validate
    if: needs.validate.result == 'success' && vars.JALWE_CODE_AGENT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-work
      - name: Recheck current owner approval and publish with expected-base lease
        env:
          CODE_UPDATE_GITHUB_TOKEN: ${{ github.token }}
        run: python -m self_update.cli review-publish
