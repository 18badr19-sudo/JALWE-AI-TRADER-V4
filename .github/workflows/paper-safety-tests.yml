name: JALWE PAPER Safety Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PAPER safety tests
        env:
          ALPACA_API_KEY: test-key
          ALPACA_SECRET_KEY: test-secret
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          PAPER_TRADING: "true"
          ALLOW_LIVE_TRADING: "false"
          TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/bridge_test
        run: |
          python -m unittest discover -s tests -v
